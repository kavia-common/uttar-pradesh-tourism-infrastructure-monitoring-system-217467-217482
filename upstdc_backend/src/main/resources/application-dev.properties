# Server
# Note: backend container will usually be reverse-proxied to 3001 for local dev
server.port=8080

# Datasource (dev) - explicitly target the running postgres on 5001 with sensible defaults
# You can override via .env variables: POSTGRES_URL, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5001}/${POSTGRES_DB:upstdc}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - run DB migrations automatically on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# CORS (frontend on 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=true

# File storage
app.storage.base-path=${FILE_STORAGE_BASE_PATH:./storage}

# JWT configuration (placeholders - override via env in deployment)
# IMPORTANT: Use a 32+ character secret for HS256
app.security.jwt.secret=${JWT_SECRET:please-change-dev-secret-at-least-32-chars-1234567890}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}        # 15 minutes
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:1209600000}  # 14 days

# Actuator/health exposure for local readiness/liveness
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
