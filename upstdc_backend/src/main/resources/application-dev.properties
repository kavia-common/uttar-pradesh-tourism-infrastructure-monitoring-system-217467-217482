# Server
server.port=8080

# Datasource (dev) - uses env if provided else defaults
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5001/${POSTGRES_DB:upstdc}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS (frontend on 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.allow-credentials=true

# File storage
app.storage.base-path=${FILE_STORAGE_BASE_PATH:./storage}

# JWT configuration (placeholders - override via env in deployment)
app.security.jwt.secret=${JWT_SECRET:please-change-dev-secret-at-least-32-chars-1234567890}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}        # 15 minutes
app.security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:1209600000}  # 14 days
